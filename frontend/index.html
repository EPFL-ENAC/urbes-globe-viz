<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/globe.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/fonts/SuisseIntl-Light.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/SuisseIntl-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>URBES - Laboratory of Urban and Environmental Systems</title>
  </head>
  <body>
    <!-- Duotone ramps for the GHSL basemap canvas (see style.css). The raster is
         baked pure white with settlement density in alpha, so it composites to a
         plain greyscale ramp and MapLibre cannot colour it (this build has no
         raster-color). A CSS sepia/hue-rotate chain can tint it but cannot land
         on a specific hex — it drifts pink. feComponentTransfer maps the ramp
         onto exact stops instead: white -> --color-accent -> deep violet in
         light, black -> --color-accent-strong -> pale lilac in dark.
         color-interpolation-filters="sRGB" is required; the SVG default of
         linearRGB would shift every stop. -->
    <svg class="svg-filter-defs" aria-hidden="true" focusable="false">
      <defs>
        <!-- Stops are near-monochrome by design: the globe should read as the
             black/white original with a violet cast, not as a violet globe.
             Chroma stays low and both ends run to white / black; only the
             midtone carries visible colour. Hue holds at ~265deg across all
             stops so the tint never drifts toward pink. -->
        <!-- Five stops, not three. GHSL density is heavily skewed to low
             values, so most settled pixels land in the FIRST part of the ramp;
             a straight line from white to a pale midpoint drops them onto the
             paper and the globe reads empty. These curves fall steeply early
             and flatten late, so low-density settlement keeps its body while
             the ends stay clean white / black. Weighted toward body over
             chroma: the early stops sit well clear of the paper/void so the
             continents keep their mass. Hue holds at ~263-267deg throughout, so
             the extra tone never turns the globe into a colour field. -->
        <!-- white paper -> violet-greys -> near-black violet -->
        <filter id="ghsl-duotone-light" color-interpolation-filters="sRGB">
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncR type="table" tableValues="1 0.78 0.58 0.36 0.165" />
            <feFuncG type="table" tableValues="1 0.73 0.51 0.29 0.106" />
            <feFuncB type="table" tableValues="1 0.84 0.68 0.46 0.239" />
          </feComponentTransfer>
        </filter>
        <!-- black -> violet-greys -> near-white violet -->
        <filter id="ghsl-duotone-dark" color-interpolation-filters="sRGB">
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0 0.22 0.45 0.70 0.949" />
            <feFuncG type="table" tableValues="0 0.17 0.37 0.63 0.918" />
            <feFuncB type="table" tableValues="0 0.30 0.57 0.81 1" />
          </feComponentTransfer>
        </filter>
        <!-- Dataset preview duotones (billboards on the globe + card
             thumbnails). Unlike the basemap above these carry the DATA, so
             they keep real chroma - the ramp climbs to ~70% saturation rather
             than staying near-monochrome. Hue is pinned at 260deg, matching
             --color-accent, at every stop.

             These replace a `sepia() hue-rotate() saturate() brightness()`
             chain. That chain was correct in light mode but the dark variant's
             brightness(1.3) drove the already-saturated output past 255: once a
             channel clips, the ratio between channels collapses and the hue
             slides from 262deg to ~300deg, so the brightest (and densest) parts
             of a preview washed out to pink-white. A table ramp sets both
             endpoints explicitly and cannot clip, so the two themes differ by
             where the ramp sits, not by a multiply on top of it. -->
        <!-- near-black -> accent -> pale lavender. The luminance of these five
             stops tracks the old sepia chain almost exactly (0/30/60/83/95%),
             so the previews keep the airy, high-contrast look they had; the
             only thing that changes is that hue stays at 260deg through the
             highlights instead of drifting to 300deg once they clipped. -->
        <filter id="preview-duotone-light" color-interpolation-filters="sRGB">
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0.018 0.27 0.538 0.795 0.937" />
            <feFuncG type="table" tableValues="0.014 0.21 0.425 0.725 0.912" />
            <feFuncB type="table" tableValues="0.026 0.39 0.765 0.935 0.988" />
          </feComponentTransfer>
        </filter>
        <!-- Same hue, lifted so the data reads against the dark globe. Matches
             the old brightness(1.3) exposure (0/48/86/100/100%) but stops just
             short of pure white, keeping a violet cast in the brightest data
             where the old chain blew it out to flat #ffffff. -->
        <filter id="preview-duotone-dark" color-interpolation-filters="sRGB">
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0.027 0.432 0.743 0.889 0.968" />
            <feFuncG type="table" tableValues="0.021 0.336 0.67 0.847 0.954" />
            <feFuncB type="table" tableValues="0.039 0.624 0.89 0.973 0.996" />
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
